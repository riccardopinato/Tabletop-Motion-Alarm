name: Bootstrap Android source v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-v2.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_* > /tmp/tabletop-source.b64
          base64 -d /tmp/tabletop-source.b64 > /tmp/tabletop-source.tar.gz
          echo "0e959a8a56a63b699de09376886c774d50277d3aac786458e5f336319f439198  /tmp/tabletop-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/import
          tar -xzf /tmp/tabletop-source.tar.gz -C /tmp/import
          rm -rf /tmp/import/.github

      - name: Import source
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/import/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md SIGNING_IDENTITY.md app build.gradle.kts gradle gradle.properties settings.gradle.kts
          git commit -m "bootstrap: import Android application source"
          git push origin HEAD:main
