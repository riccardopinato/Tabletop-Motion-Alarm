name: Bootstrap Android source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_00 .bootstrap/chunk_01 .bootstrap/chunk_02 .bootstrap/chunk_03 > /tmp/tabletop-source.b64
          base64 -d /tmp/tabletop-source.b64 > /tmp/tabletop-source.tar.gz
          echo "0e959a8a56a63b699de09376886c774d50277d3aac786458e5f336319f439198  /tmp/tabletop-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tabletop-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: import Tabletop Motion Alarm Android source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
