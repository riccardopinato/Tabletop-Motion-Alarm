name: Bootstrap source import

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message || '', 'bootstrap: import Android source') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_* > /tmp/tabletop-source.b64
          base64 -d /tmp/tabletop-source.b64 > /tmp/tabletop-source.tar.gz
          echo "0e959a8a56a63b699de09376886c774d50277d3aac786458e5f336319f439198  /tmp/tabletop-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tabletop-source.tar.gz -C .

      - name: Remove bootstrap transport
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "bootstrap: import Android source"
          git push origin HEAD:main
